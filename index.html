<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sayt vaqtincha ishlamayapti</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F1E6">
<style>
  :root{
    --bg:#F6F1E6;
    --text:#1B1712;
    --text-dim:#6B6355;
    --accent:#7A2436;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    text-align:center;
    padding:24px;
  }
  .wrap{max-width:480px}
  h1{
    font-size:clamp(22px,4vw,32px);
    margin:0 0 12px;
    color:var(--accent);
  }
  p{
    margin:0;
    color:var(--text-dim);
    font-size:16px;
    line-height:1.6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Sayt vaqtincha ishlamayapti</h1>
    <p>Texnik ishlar olib borilmoqda. Iltimos, keyinroq qayta tashrif buyuring.</p>
  </div>
</body>
</html>
